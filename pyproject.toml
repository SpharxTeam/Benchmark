[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "benchmark"
version = "1.0.0"
description = "Benchmark 独立算法基准库 - 提供算法性能评测框架,支持延迟/吞吐/内存/准确度基准测试"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "SPHARX Team", email = "lidecheng@spharx.cn"}
]
maintainers = [
    {name = "SPHARX Team", email = "wangliren@spharx.cn"}
]
keywords = ["benchmark", "performance", "latency", "throughput", "memory", "accuracy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Benchmark",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "rich>=13.0.0",
]

[project.scripts]
benchmark = "core_benchmark.cli.main:main"
benchmark-run = "core_benchmark.cli.main:run_suite"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "flake8>=6.1.0",
    "flake8-docstrings>=1.7.0",
    "pre-commit>=3.5.0",
]
accuracy = [
    "scikit-learn>=1.3.0",
]
all = [
    "benchmark[dev,accuracy]",
]

[project.urls]
Homepage = "https://github.com/spharx/spharxworks/tree/main/benchmark"
Documentation = "https://docs.spharx.cn/benchmark"
Repository = "https://github.com/spharx/spharxworks.git"
Issues = "https://github.com/spharx/spharxworks/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["core_benchmark*", "core_benchmark.core*", "core_benchmark.metrics*", "core_benchmark.runners*", "core_benchmark.reporting*", "core_benchmark.cli*", "core_benchmark.config*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | produce
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["core_benchmark", "core_benchmark.core", "core_benchmark.metrics", "core_benchmark.runners", "core_benchmark.reporting", "core_benchmark.cli"]
known_third_party = ["numpy", "yaml", "pydantic", "rich"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers --cov=core_benchmark --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["core_benchmark"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/produce/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 85
